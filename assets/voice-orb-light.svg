<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-label="Animated voice agent orb: listening and speaking">
<style>.ring{transform-box:fill-box;transform-origin:center;animation:ripple 3s ease-out infinite}
@keyframes ripple{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.6);opacity:0}}
.core{transform-box:fill-box;transform-origin:center;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
.bar{transform-box:fill-box;transform-origin:center;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.l1{animation:swapA 6s steps(1) infinite} .l2{animation:swapB 6s steps(1) infinite}
@keyframes swapA{0%{opacity:1}50%{opacity:0}} @keyframes swapB{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ring,.core,.bar,.l1,.l2{animation:none}}</style>
<defs><radialGradient id="g" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#1a7f37"/></radialGradient></defs>
<circle class="ring" cx="210" cy="140" r="70" fill="none" stroke="#1a7f37" stroke-width="2" style="animation-delay:0.0s"/><circle class="ring" cx="210" cy="140" r="70" fill="none" stroke="#1a7f37" stroke-width="2" style="animation-delay:1.0s"/><circle class="ring" cx="210" cy="140" r="70" fill="none" stroke="#1a7f37" stroke-width="2" style="animation-delay:2.0s"/>
<circle class="core" cx="210" cy="140" r="66" fill="url(#g)"/>
<rect class="bar" x="154" y="136.0" width="4" height="8.0" rx="2" fill="#ffffff" style="animation-delay:-0.00s"/><rect class="bar" x="162" y="122.6" width="4" height="34.8" rx="2" fill="#ffffff" style="animation-delay:-0.13s"/><rect class="bar" x="170" y="122.8" width="4" height="34.5" rx="2" fill="#ffffff" style="animation-delay:-0.26s"/><rect class="bar" x="178" y="131.8" width="4" height="16.5" rx="2" fill="#ffffff" style="animation-delay:-0.39s"/><rect class="bar" x="186" y="134.3" width="4" height="11.4" rx="2" fill="#ffffff" style="animation-delay:-0.52s"/><rect class="bar" x="194" y="130.4" width="4" height="19.2" rx="2" fill="#ffffff" style="animation-delay:-0.65s"/><rect class="bar" x="202" y="127.1" width="4" height="25.9" rx="2" fill="#ffffff" style="animation-delay:-0.78s"/><rect class="bar" x="210" y="134.8" width="4" height="10.5" rx="2" fill="#ffffff" style="animation-delay:-0.91s"/><rect class="bar" x="218" y="121.7" width="4" height="36.5" rx="2" fill="#ffffff" style="animation-delay:-1.04s"/><rect class="bar" x="226" y="118.8" width="4" height="42.4" rx="2" fill="#ffffff" style="animation-delay:-0.07s"/><rect class="bar" x="234" y="129.1" width="4" height="21.9" rx="2" fill="#ffffff" style="animation-delay:-0.20s"/><rect class="bar" x="242" y="130.3" width="4" height="19.3" rx="2" fill="#ffffff" style="animation-delay:-0.33s"/><rect class="bar" x="250" y="130.5" width="4" height="19.0" rx="2" fill="#ffffff" style="animation-delay:-0.46s"/><rect class="bar" x="258" y="133.7" width="4" height="12.5" rx="2" fill="#ffffff" style="animation-delay:-0.59s"/><rect class="bar" x="266" y="136.0" width="4" height="8.0" rx="2" fill="#ffffff" style="animation-delay:-0.72s"/>
<text class="l1" x="210" y="262" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1a7f37">● listening · Hindi / Marathi / English</text>
<text class="l2" x="210" y="262" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#0969da">● speaking · ~800 ms target</text>
<text x="210" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#59636e">VAD → STT → LLM → TTS, in real time</text>
</svg>