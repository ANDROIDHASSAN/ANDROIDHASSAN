<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Voice agent pipeline: INPUT, VAD, STT, LLM, TTS, OUTPUT, with the project that targets each stage and its status.">
<style>.pulse{animation:travel 4.5s cubic-bezier(.45,0,.55,1) infinite}
