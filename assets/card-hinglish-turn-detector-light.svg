<svg xmlns="http://www.w3.org/2000/svg" width="410" height="230" viewBox="0 0 410 230" role="img" aria-label="hinglish-turn-detector: Hinglish Turn Detector (planned)"><style>.flow{stroke-dasharray:5 6;animation:dash 1.1s linear infinite}
