<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Open to work: remote Voice AI and Agents Engineer roles. Real-time voice agents, LiveKit and Pipecat, Python and TypeScript, Indic speech. hassankazinasik@gmail.com">
<style>
.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.ring,.bar,.glow{animation:none}}
</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
</defs>
<rect x="1" y="1" width="838" height="148" rx="14" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
<rect class="glow" x="1" y="1" width="838" height="148" rx="14" fill="none" stroke="url(#edge)" stroke-width="1" opacity=".5"/>
<circle class="ring" cx="40" cy="42" r="7" fill="#3fb950"/>
<circle cx="40" cy="42" r="7" fill="#3fb950"/>
<text class="f" x="58" y="47" font-size="14" font-weight="800" letter-spacing="2" fill="#3fb950">OPEN TO WORK</text>
<text class="f" x="58" y="47" dx="138" font-size="13" fill="#8b949e">· remote · full-time or contract</text>
<text class="f" x="32" y="84" font-size="24" font-weight="800" fill="#e6edf3">Voice AI &amp; Agents Engineer</text>
<g class="f" font-size="12" font-weight="600">
<rect x="32" y="102" width="168" height="26" rx="13" fill="#0f2a17" stroke="#238636"/><text x="116" y="119" text-anchor="middle" fill="#7ee787">Real-time voice agents</text>
<rect x="208" y="102" width="138" height="26" rx="13" fill="#0c2240" stroke="#1f6feb"/><text x="277" y="119" text-anchor="middle" fill="#79c0ff">LiveKit · Pipecat</text>
<rect x="354" y="102" width="146" height="26" rx="13" fill="#251a3d" stroke="#8957e5"/><text x="427" y="119" text-anchor="middle" fill="#d2a8ff">Python · TypeScript</text>
<rect x="508" y="102" width="118" height="26" rx="13" fill="#2d1f0b" stroke="#bb8009"/><text x="567" y="119" text-anchor="middle" fill="#f2cc60">Indic speech</text>
</g>
<g transform="translate(700 36)" fill="#3fb950">
<rect class="bar" x="0" y="0" width="8" height="56" rx="4" style="animation-delay:0s"/>
<rect class="bar" x="16" y="0" width="8" height="56" rx="4" fill="#58a6ff" style="animation-delay:.15s"/>
<rect class="bar" x="32" y="0" width="8" height="56" rx="4" fill="#a371f7" style="animation-delay:.3s"/>
<rect class="bar" x="48" y="0" width="8" height="56" rx="4" fill="#58a6ff" style="animation-delay:.45s"/>
<rect class="bar" x="64" y="0" width="8" height="56" rx="4" style="animation-delay:.6s"/>
<rect class="bar" x="80" y="0" width="8" height="56" rx="4" fill="#a371f7" style="animation-delay:.75s"/>
</g>
<text class="f" x="745" y="120" text-anchor="middle" font-size="12" fill="#8b949e">hassankazinasik@gmail.com</text>
</svg>
