<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Open to work: remote Voice AI and Agents Engineer roles. Real-time voice agents, LiveKit and Pipecat, Python and TypeScript, Indic speech. hassankazinasik@gmail.com">
<style>
.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.ring,.bar,.glow{animation:none}}
</style>
<defs>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a7f37"/><stop offset=".5" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
</defs>
<rect x="1" y="1" width="838" height="148" rx="14" fill="#ffffff" stroke="url(#edge)" stroke-width="2"/>
<rect class="glow" x="1" y="1" width="838" height="148" rx="14" fill="none" stroke="url(#edge)" stroke-width="1" opacity=".5"/>
<circle class="ring" cx="40" cy="42" r="7" fill="#1a7f37"/>
<circle cx="40" cy="42" r="7" fill="#1a7f37"/>
<text class="f" x="58" y="47" font-size="14" font-weight="800" letter-spacing="2" fill="#1a7f37">OPEN TO WORK</text>
<text class="f" x="58" y="47" dx="138" font-size="13" fill="#57606a">· remote · full-time or contract</text>
<text class="f" x="32" y="84" font-size="24" font-weight="800" fill="#1f2328">Voice AI &amp; Agents Engineer</text>
<g class="f" font-size="12" font-weight="600">
<rect x="32" y="102" width="168" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37"/><text x="116" y="119" text-anchor="middle" fill="#116329">Real-time voice agents</text>
<rect x="208" y="102" width="138" height="26" rx="13" fill="#ddf4ff" stroke="#0969da"/><text x="277" y="119" text-anchor="middle" fill="#0550ae">LiveKit · Pipecat</text>
<rect x="354" y="102" width="146" height="26" rx="13" fill="#fbefff" stroke="#8250df"/><text x="427" y="119" text-anchor="middle" fill="#6639ba">Python · TypeScript</text>
<rect x="508" y="102" width="118" height="26" rx="13" fill="#fff8c5" stroke="#9a6700"/><text x="567" y="119" text-anchor="middle" fill="#7d4e00">Indic speech</text>
</g>
<g transform="translate(700 36)" fill="#1a7f37">
<rect class="bar" x="0" y="0" width="8" height="56" rx="4" style="animation-delay:0s"/>
<rect class="bar" x="16" y="0" width="8" height="56" rx="4" fill="#0969da" style="animation-delay:.15s"/>
<rect class="bar" x="32" y="0" width="8" height="56" rx="4" fill="#8250df" style="animation-delay:.3s"/>
<rect class="bar" x="48" y="0" width="8" height="56" rx="4" fill="#0969da" style="animation-delay:.45s"/>
<rect class="bar" x="64" y="0" width="8" height="56" rx="4" style="animation-delay:.6s"/>
<rect class="bar" x="80" y="0" width="8" height="56" rx="4" fill="#8250df" style="animation-delay:.75s"/>
</g>
<text class="f" x="745" y="120" text-anchor="middle" font-size="12" fill="#57606a">hassankazinasik@gmail.com</text>
</svg>
